type User {
    id: ID!
    name: String!
    lastname: String!
    email: String!
    created_at: DateTime!
    updated_at: DateTime!
}

type Category{
    id: Int!
    name: String!
    state:Int!
}

type Extension{
    id: Int!
    name: String!
    state:Int!
}

type Image {
    id: Int!
    name: String!
    image: String!
    created_at: DateTime!
    updated_at: DateTime!
}

type LastCongress {
    id: Int!
    name: String!
    url: String
    file: String
    created_at: DateTime!
    updated_at: DateTime!
}

type LinesInvestigation{
    id: Int!
    name: String!
    state:Int!
}

type Articles{
    id: Int!
    title: String!
    description: String!
    category_id: Int!
    line_id: Int!
    editorial: String!
    publication_date: String!
    file: String!,
    authors:[Author!] @hasMany
}

type Author{
    id:Int!
    name:String!
    article_id:Int!
}
