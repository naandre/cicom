"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-01-01 13:00:00`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"A date string with format `Y-m-d`, e.g. `2011-05-23`."
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

type Query {
    users: [User!]! @all(model: "App\\Models\\Users\\User")
    user(id: ID @eq): User @find(model: "App\\Models\\Users\\User")
    me: User! @auth
    categories: [Category!]! @all(model: "App\\Models\\Articles\\Category")
    extensions: [Extension!]! @all(model: "App\\Models\\Articles\\Extension")
    images:[Image!] @all(model: "App\\Models\\Articles\\Image")
    lascongress:[LastCongress] @all(model: "App\\Models\\Articles\\LastCongress")
    lines:[LinesInvestigation!] @all(model: "App\\Models\\Articles\\LinesInvestigation")
    articles:[Articles!] @all(model: "App\\Models\\Articles\\Article")
    author:[Author!] @all(model: "App\\Models\\Articles\\Author")
    articleFilter(
        title: String
        category_id: Int
        line_id: Int
        publication_date: Date,
        author: String
    ): [Articles!]
}

